name: IRE integer rails
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Locked-integer watchdog
        run: python3 tools/ire_test_harness.py
      - name: Open pass
        run: python3 tools/ire_open_pass.py
      - name: Invariant tests
        run: python3 tests/test_sovereign_invariants.py
